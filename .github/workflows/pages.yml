name: Deploy Makmur Lab to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare public files
        run: |
          mkdir _site
          cp *.html styles.css script.js robots.txt .nojekyll _site/
          cp -R assets _site/assets

      - name: Checkout Knowledge Alpha
        uses: actions/checkout@v6
        with:
          ref: fa689a643ae9749b575372b2ec9eeeefbe2c18b5
          path: _alpha-source

      - name: Set up Node.js for Knowledge Alpha
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: _alpha-source/package-lock.json

      - name: Install Knowledge Alpha dependencies
        run: npm ci
        working-directory: _alpha-source

      - name: Build Knowledge Alpha
        run: npm run build
        working-directory: _alpha-source
        env:
          NEXT_PUBLIC_BASE_PATH: /makmur-lab/alpha
          NEXT_PUBLIC_SITE_URL: https://makmurmanik44-oss.github.io/makmur-lab/alpha

      - name: Add Knowledge Alpha preview
        run: |
          mkdir _site/alpha
          cp -R _alpha-source/out/. _site/alpha/

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
